[package]
name = "scout4all-mobile"
description = "The bindings of the scout4all core for the native apps (Android, iOS), generated with UniFFI."
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "scout4all_mobile"
# cdylib for Android, staticlib for iOS, lib for the bindgen and the tests
crate-type = ["cdylib", "staticlib", "lib"]

# generates the Kotlin (and Swift) bindings from the built library
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
chrono.workspace = true
scout4all-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
uniffi = "0.32"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
