[package]
name = "scout4all"
description = "scout4all is a CLI tool for collecting, managing and reporting volleyball match data. It helps coaches and analysts track match events and generate useful reports for post-game analysis."
keywords = ["volley", "volleyball", "tui", "ratatui"]
version.workspace = true
edition.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace]
members = ["core"]

# the version of the release: shared by all the crates
[workspace.package]
version = "0.8.0"
edition = "2024"
authors = ["Nicola @naighes Baldi <nic.baldi@gmail.com>"]
homepage = "https://github.com/naighes/scoutforall"
repository = "https://github.com/naighes/scoutforall"
license = "AGPL-3.0-only"
rust-version = "1.92"

[workspace.dependencies]
scout4all-core = { path = "core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs = "7"
futures = "0.3.31"
regex = "1"
reqwest = { version = "0.13", features = ["json", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread", "io-util"] }
tokio-stream = { version = "0.1.17", features = ["fs"] }
typst = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["datetime", "embedded-fonts", "scan-fonts"] }
typst-layout = "0.15"
typst-pdf = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zip = "9"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
match_str_case_mismatch = "allow"

[profile.release]
opt-level = 3
debug = "none"
debug-assertions = false
overflow-checks = true
strip = true
panic = "abort"
incremental = false

[dependencies]
scout4all-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
crokey = "1.3.0"
csv.workspace = true
dirs.workspace = true
hf = "0.6"
ratatui = "0.30"
regex.workspace = true
reqwest.workspace = true
self_update = { version = "1", optional = true, features = ["checksums"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
winres = "0.1.12"

[lints]
workspace = true

[features]
default = []
self-update = ["self_update"]

[build-dependencies]
winres = { version = "0.1.12" }

[package.metadata.cargo-machete]
ignored = ["winres"]
