[workspace]
members = ["bench", "core", "desktop", "keys", "mobile"]
resolver = "3"

# the version of the release: shared by all the crates
[workspace.package]
version = "0.18.0"
edition = "2024"
authors = ["Nicola @naighes Baldi <nic.baldi@gmail.com>"]
homepage = "https://github.com/naighes/scoutforall"
repository = "https://github.com/naighes/scoutforall"
license = "AGPL-3.0-only"
rust-version = "1.99"

[workspace.dependencies]
scout4all-core = { path = "core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs = "7"
encoding_rs = "0.8"
futures = "0.3.31"
regex = "1"
reqwest = { version = "0.13", features = ["json", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread", "io-util"] }
typst = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["datetime", "embedded-fonts", "scan-fonts"] }
typst-layout = "0.15"
typst-pdf = "0.15"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zip = "9"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
match_str_case_mismatch = "allow"
# the app never panics on the user: errors are handled, not unwrapped (the
# tests may, see clippy.toml)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
opt-level = 3
debug = "none"
debug-assertions = false
overflow-checks = true
strip = true
panic = "abort"
incremental = false

# the core of the apps: as release, but a panic unwinds, and UniFFI turns it
# into an exception of the app, which says so and restarts, instead of
# closing at once; with its symbols, which the Android build takes out of the
# app and gives to Play, to name the functions of a crash
[profile.mobile]
inherits = "release"
panic = "unwind"
strip = false
