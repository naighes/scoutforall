[package]
name = "scout4all"
description = "scout4all is a CLI tool for collecting, managing and reporting volleyball match data. It helps coaches and analysts track match events and generate useful reports for post-game analysis."
keywords = ["volley", "volleyball", "tui", "ratatui"]
version = "0.0.7"
edition = "2024"
authors = ["Nicola @naighes Baldi <nic.baldi@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/naighes/scoutforall"
repository = "https://github.com/naighes/scoutforall"
license = "AGPL-3.0-only"
rust-version = "1.92"

[profile.release]
opt-level = 3
debug = "none"
debug-assertions = false
overflow-checks = true
strip = true
panic = "abort"
incremental = false

[dependencies]
ratatui = "0.30"
thiserror = "2"
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["datetime", "embedded-fonts", "scan-fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
regex = "1"
csv = "1"
self_update = { version = "1", optional = true }
hf = "0.6"
zip = "9"
async-trait = "0.1"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread", "io-util"] }
tokio-stream = { version = "0.1.17", features = ["fs"] }
futures = "0.3.31"
reqwest = { version = "0.13", features = ["json", "cookies"] }
crokey = "1.3.0"

[target.'cfg(windows)'.dependencies]
winres = "0.1.12"

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
match_str_case_mismatch = "allow"

[features]
default = []
self-update = ["self_update"]

[build-dependencies]
winres = { version = "0.1.12" }

[package.metadata.cargo-machete]
ignored = ["winres"]
