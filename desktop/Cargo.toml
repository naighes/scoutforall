[package]
name = "scout4all-desktop"
description = "The desktop app of scout4all (Windows, macOS, Linux), written with iced: it will replace the TUI."
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "scout4all-desktop"
path = "src/main.rs"

[dependencies]
dirs.workspace = true
iced = { version = "=0.14.0", features = ["canvas", "advanced", "svg"] }
scout4all-core.workspace = true
scout4all-keys = { path = "../keys" }
scout4all-mobile = { path = "../mobile" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
crokey = "1.3.0"

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true

[lints]
workspace = true
