[package]
name = "scout4all-desktop"
description = "The desktop app of scout4all (Windows, macOS, Linux), written with iced: it took the place of the TUI."
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "scout4all-desktop"
path = "src/main.rs"

[dependencies]
dirs.workspace = true
iced = { version = "=0.14.0", features = ["canvas", "advanced", "svg", "image-without-codecs"] }
scout4all-core.workspace = true
scout4all-keys = { path = "../keys" }
scout4all-mobile = { path = "../mobile" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "net", "rt"] }
retina = "0.4"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
uuid.workspace = true
chrono.workspace = true
bytes = "1"
crokey = "1.3.0"
# the images allocated before they're shown (the frames of the video), the
# same crate iced uses: its `image` feature re-exports it with all the codecs
iced_runtime = "=0.14.0"
mp4 = "0.14"
openh264 = "0.9"
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }
open = "5.4.5"
rfd = "0.17.2"
self_update = { version = "1", optional = true, features = ["checksums"] }
rml_rtmp = "0.8"
qrcode = { version = "0.14", default-features = false }
# the window of the app, for the share sheet of the system (`share`)
raw-window-handle = "0.6"
# the video of the actions picked (`video::montage`): its frames drawn on,
# with the versions iced draws with
tiny-skia = "0.11"
resvg = "0.45"
ab_glyph = "0.2"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSView", "NSResponder"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_Shell",
] }
windows-collections = "0.3"

[features]
# the builds of the releases only: they update themselves (`update`)
self-update = ["self_update"]

[dev-dependencies]
rqrr = { version = "0.10", default-features = false }
tempfile.workspace = true

[build-dependencies]
winres = "0.1.12"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["winres"]
