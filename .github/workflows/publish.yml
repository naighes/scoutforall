name: release

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTDOCFLAGS: '--deny warnings'
  MINIMUM_SUPPORTED_RUST_VERSION: 1.92.0
  DOCKER_REGISTRY: ghcr.io

permissions:
  id-token: write
  packages: write
  contents: write
  attestations: write
  pull-requests: write
  actions: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:

jobs:
  version:
    name: determine version to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: release
        run: echo "version=$(cargo pkgid --manifest-path Cargo.toml | cut -d '@' -f2)" >> "$GITHUB_OUTPUT"

  create-release:
    runs-on: ubuntu-latest
    name: create release
    needs: version
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # a draft until every asset is uploaded: the website and the self update
      # follow the latest release, which must never lack an asset
      - name: create github release
        run: gh release create "v${VERSION}" --generate-notes --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCHIVE: ${{ steps.variables.outputs.archive }}

  build-and-publish:
    needs: [version, create-release]
    name: build and publish
    runs-on: ${{ matrix.platforms.os }}
    strategy:
      matrix:
        platforms:
          - os: macos-14
            target: aarch64-apple-darwin
            features: "--features self-update"
          - os: macos-14
            target: x86_64-apple-darwin
            features: "--features self-update"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "--features self-update"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: "--features self-update"
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            features: "--features self-update"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "--features self-update"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.platforms.target }}
          args: "--verbose --locked --release ${{ matrix.platforms.features }}"
          strip: true
        env:
          LINEAR_TOKEN: ${{ secrets.LINEAR_TOKEN }}
          LINEAR_TEAM_ID: ${{ vars.LINEAR_TEAM_ID }}
          ANALYTICS_UPLOAD_URL: ${{ vars.ANALYTICS_UPLOAD_URL }}
      # the self update of every released client (src/updater.rs) picks the
      # first asset whose name contains its target, then installs it as is or
      # extracts `scout4all` (`scout4all.exe`) from it: only the bare binary
      # and the archives may carry the target in their name, and the bare
      # binary is uploaded first and sorts first
      - name: setup variables
        id: variables
        shell: bash
        run: |
          name="$(cargo metadata --manifest-path Cargo.toml --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="scout4all").targets[0].name')"
          exe=""
          if [ "${{ matrix.platforms.os }}" = "windows-latest" ]; then
             exe=".exe"
          fi
          {
            echo "name=${name}"
            echo "source=target/${{ matrix.platforms.target }}/release/${name}${exe}"
            echo "archive=scout4all-${{ matrix.platforms.target }}"
            echo "binaryName=${name}${exe}"
            echo "binaryAsset=scout4all-${{ matrix.platforms.target }}${exe}"
          } >> "$GITHUB_OUTPUT"
      - name: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ steps.variables.outputs.source }}"
          subject-name: "${{ steps.variables.outputs.archive }}-${{ needs.version.outputs.version }}"
      - name: cargo install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: generate SBOM
        run: |
          cargo cyclonedx --describe binaries --format json ${{ matrix.platforms.features }} --target ${{ matrix.platforms.target }}
      - name: stage archive content
        shell: bash
        run: |
          mkdir -p package dist
          cp "${SOURCE}" "package/${BINARY}"
          mv "${NAME}_bin.cdx.json" "package/${NAME}.cdx.json"
          cp "${SOURCE}" "dist/${BINARY_ASSET}"
        env:
          NAME: ${{ steps.variables.outputs.name }}
          SOURCE: ${{ steps.variables.outputs.source }}
          BINARY: ${{ steps.variables.outputs.binaryName }}
          BINARY_ASSET: ${{ steps.variables.outputs.binaryAsset }}
      - name: build archive for windows
        shell: bash
        working-directory: ./package
        if: matrix.platforms.os == 'windows-latest'
        run: 7z a "../dist/${ARCHIVE}.zip" "${BINARY}" "${NAME}.cdx.json"
        env:
          NAME: ${{ steps.variables.outputs.name }}
          ARCHIVE: ${{ steps.variables.outputs.archive }}
          BINARY: ${{ steps.variables.outputs.binaryName }}
      - name: build archive for unix systems
        if: matrix.platforms.os != 'windows-latest'
        shell: bash
        working-directory: ./package
        run: tar cvzf "../dist/${ARCHIVE}.tar.gz" "${BINARY}" "${NAME}.cdx.json"
        env:
          NAME: ${{ steps.variables.outputs.name }}
          ARCHIVE: ${{ steps.variables.outputs.archive }}
          BINARY: ${{ steps.variables.outputs.binaryName }}
      - name: install rosetta to run the intel binary
        if: matrix.platforms.target == 'x86_64-apple-darwin'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - name: check release assets
        shell: bash
        working-directory: ./dist
        run: |
          for asset in *; do
            case "${asset}" in
              "${BINARY_ASSET}"|"${ARCHIVE}.tar.gz"|"${ARCHIVE}.zip") ;;
              *) echo "unexpected release asset: ${asset}"; exit 1 ;;
            esac
          done
          [ "$(ls | LC_ALL=C sort | head -n 1)" = "${BINARY_ASSET}" ] || { echo "the bare binary must sort first"; exit 1; }
          "./${BINARY_ASSET}" --version | grep -q "^${NAME} ${VERSION}$" || { echo "the bare binary does not report ${NAME} ${VERSION}"; exit 1; }
        env:
          NAME: ${{ steps.variables.outputs.name }}
          ARCHIVE: ${{ steps.variables.outputs.archive }}
          BINARY_ASSET: ${{ steps.variables.outputs.binaryAsset }}
          VERSION: ${{ needs.version.outputs.version }}
      - name: upload bare binary
        shell: bash
        run: gh release upload "v${VERSION}" "dist/${BINARY_ASSET}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          BINARY_ASSET: ${{ steps.variables.outputs.binaryAsset }}
      - name: upload archives
        shell: bash
        run: gh release upload "v${VERSION}" "dist/${ARCHIVE}".* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCHIVE: ${{ steps.variables.outputs.archive }}

  # a single macOS download for both apple silicon and intel, so that nobody has
  # to know which chip their mac has: its name carries no target, so that the
  # self update of older clients never picks it
  macos-universal:
    needs: [version, build-and-publish]
    name: build and publish the universal macOS binary
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: download the binaries of both architectures
        run: |
          gh release download "v${VERSION}" --dir parts \
            --pattern scout4all-aarch64-apple-darwin \
            --pattern scout4all-x86_64-apple-darwin
      - name: merge them into a universal binary
        run: |
          mkdir -p package dist
          lipo -create parts/scout4all-aarch64-apple-darwin parts/scout4all-x86_64-apple-darwin -output package/scout4all
          chmod +x package/scout4all
          lipo package/scout4all -verify_arch arm64 x86_64 || { echo "unexpected architectures: $(lipo -archs package/scout4all)"; exit 1; }
          package/scout4all --version | grep -q "^scout4all ${VERSION}$" || { echo "the universal binary does not report scout4all ${VERSION}"; exit 1; }
          tar cvzf dist/scout4all-macos.tar.gz -C package scout4all
      - name: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package/scout4all
          subject-name: "scout4all-macos-${{ needs.version.outputs.version }}"
      - name: upload archive
        run: gh release upload "v${VERSION}" dist/scout4all-macos.tar.gz --clobber

  publish-release:
    needs: [version, build-and-publish, macos-universal]
    name: publish release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: publish github release
        run: gh release edit "v${VERSION}" --draft=false --latest
      # the website shows the version and the sizes of the latest release
      - name: redeploy website
        run: gh workflow run deploy-pages.yml --ref master
