name: release android

# The app is released with the CLI: the same tag, the same version (the
# versionName and the versionCode come from Cargo.toml). Apart from
# publish.yml, so that a failure here never blocks the release of the CLI.

# Where it goes on Play: from the inputs when run by hand, otherwise from
# the variables PLAY_TRACK (alpha, the closed test, if unset), PLAY_STATUS
# (draft if unset: completed once the app is reviewed, inProgress for a
# staged rollout) and PLAY_ROLLOUT (the share of users of inProgress).
on:
  workflow_dispatch:
    inputs:
      track:
        description: the track of Play
        type: choice
        options: [internal, alpha, beta, production]
        default: alpha
      status:
        description: the status of the release
        type: choice
        options: [draft, completed, inProgress]
        default: draft
      rollout:
        description: the share of users, from 0 to 1, for inProgress
        type: string
        required: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: io.github.naighes.scout4all

jobs:
  bundle:
    name: build the signed bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME}, Cargo.toml ${version}"; exit 1; }
      # the release notes of this version in every language, before the
      # build: Play shows them to the testers
      - name: check the listing and the release notes
        run: python3 -I android/fastlane/check.py --release
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
      # the one of ndkVersion in app/build.gradle.kts
      - name: install the NDK
        run: |
          ndk="$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)"
          sdkmanager --install "ndk;${ndk}"
      - uses: gradle/actions/setup-gradle@v6
      # the upload key, never in git (app/build.gradle.kts): without it the
      # bundle would be signed with a debug key, which Play refuses
      - name: restore the upload key
        run: |
          [ -n "${KEYSTORE}" ] && [ -n "${UPLOAD_STORE_PASSWORD}" ] && [ -n "${UPLOAD_KEY_ALIAS}" ] && [ -n "${UPLOAD_KEY_PASSWORD}" ] \
            || { echo "missing the secrets of the upload key"; exit 1; }
          echo "${KEYSTORE}" | base64 --decode > "${RUNNER_TEMP}/upload.jks"
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      - name: build the bundle
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ANALYTICS_UPLOAD_URL: ${{ vars.ANALYTICS_UPLOAD_URL }}
      - name: check the bundle
        run: |
          [ -n "${ANALYTICS_UPLOAD_URL}" ] || { echo "no ANALYTICS_UPLOAD_URL: the app would send no statistics"; exit 1; }
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          certs="$(jarsigner -verify -verbose -certs "${bundle}")"
          echo "${certs}" | grep -q "jar verified" || { echo "the bundle is not signed"; exit 1; }
          ! echo "${certs}" | grep -q "CN=Android Debug" || { echo "the bundle is signed with a debug key"; exit 1; }
          rm -f "${RUNNER_TEMP}/upload.jks"
        env:
          ANALYTICS_UPLOAD_URL: ${{ vars.ANALYTICS_UPLOAD_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: scout4all-android-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # the bundle and its release notes (fastlane/metadata/android/<language>/
  # changelogs/<versionCode>.txt) to Play; the listing is play-listing.yml.
  # Only once the service account exists (Play Console → Users and
  # permissions) with its key in PLAY_SERVICE_ACCOUNT_JSON
  play:
    name: upload to Play
    needs: bundle
    if: vars.PLAY_UPLOAD == 'true'
    runs-on: ubuntu-latest
    # one edit of the app at a time on Play
    concurrency:
      group: play
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: android/fastlane
      - uses: actions/download-artifact@v4
        with:
          name: scout4all-android-${{ github.ref_name }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document --version 2.240.1
      - name: upload the bundle
        run: |
          # by hand, the inputs alone
          [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && ROLLOUT="${INPUT_ROLLOUT}" || ROLLOUT="${PLAY_ROLLOUT}"
          case "${STATUS}:${ROLLOUT}" in
            inProgress:0.*) ;;
            inProgress:*) echo "inProgress wants a rollout between 0 and 1, not '${ROLLOUT}'"; exit 1 ;;
            *:) ;;
            *) echo "a rollout is only for inProgress, not ${STATUS}"; exit 1 ;;
          esac
          fastlane supply \
            --package_name "${PACKAGE_NAME}" \
            --aab app-release.aab \
            --track "${TRACK}" \
            --release_status "${STATUS}" \
            ${ROLLOUT:+--rollout "${ROLLOUT}"} \
            --metadata_path android/fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track || vars.PLAY_TRACK || 'alpha' }}
          STATUS: ${{ inputs.status || vars.PLAY_STATUS || 'draft' }}
          INPUT_ROLLOUT: ${{ inputs.rollout }}
          PLAY_ROLLOUT: ${{ vars.PLAY_ROLLOUT }}
