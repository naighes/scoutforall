name: build

# On every push, master too: the merged code checked, and the caches the
# branches start from saved (a branch reads only its own caches and those of
# master; only master saves them, to stay within the 10 GB of the
# repository). No pull_request: the commits of a pull request are the ones
# pushed, checked already.
on:
  schedule:
    - cron: "0 0 1 * *" # first day of every month
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTDOCFLAGS: "--deny warnings"
  MINIMUM_SUPPORTED_RUST_VERSION: 1.92.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a run of master is let finish, to save its caches
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The jobs all start at once: none waits for another.
jobs:
  # the workspace with beta and nightly, to know early what the next
  # versions of Rust will break: once a month, or when asked
  build:
    name: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        rust:
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: run cargo build
        run: cargo build

  build-for-targets:
    name: build for targets
    runs-on: ${{ matrix.platforms.os }}
    permissions:
      contents: read
    strategy:
      # a target broken fails the run, the others built all the same, to
      # tell every target broken at once
      fail-fast: false
      matrix:
        platforms:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.platforms.target }}
          # the desktop app, which the releases publish
          args: "--locked --package scout4all-desktop"
          strip: true
          rust-cache-parameters: '{"save-if": "${{ github.ref == ''refs/heads/master'' }}"}'
      # every DLL it loads must come with Windows (see the script)
      - name: check the DLLs of the windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: python .github/scripts/check-windows-dlls.py "target/${{ matrix.platforms.target }}/debug/scout4all-desktop.exe"

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: check lockfile matches Cargo.toml
        run: cargo metadata --locked --format-version 1 > /dev/null

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- --deny warnings

  format:
    name: format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: run cargo fmt
        run: cargo fmt --all -- --check

  unused-dependencies:
    name: unused dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: bnjbvr/cargo-machete@main

  tests:
    name: tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # built already, not compiled here
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: scripts/test.sh
        env:
          RUST_BACKTRACE: full
          CI: "true"
      # the line the self update of the released clients checks (the
      # dependencies built for the tests)
      - name: check the version line
        run: cargo run --locked --package scout4all-desktop -- --version

  # the listing within the limits of Play, before it reaches master and
  # play-listing.yml uploads it
  play-listing:
    name: play listing
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: check the listing
        run: python3 -I android/fastlane/check.py

  android-tests:
    name: android tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
      # its cache saved by master only, as by default
      - uses: gradle/actions/setup-gradle@v6
      # the screens on the JVM, with the core built for the runner: no NDK
      - name: run the tests of the app
        working-directory: android
        run: ./gradlew testDebugUnitTest
