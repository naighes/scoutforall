[package]
name = "scout4all-core"
description = "The domain of scout4all, independent of the user interface: lineup, replay of the events, statistics, PDF report, persistence."
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
chrono.workspace = true
csv.workspace = true
# the DataVolley files written in the code pages of Windows
encoding_rs.workspace = true
futures.workspace = true
regex.workspace = true
reqwest.workspace = true
# the database of the data (TODO/001, D6)
rusqlite.workspace = true
# the counters of the statistics: a quick hash of small keys, not SipHash,
# which doesn't need to resist attacks there (already built for typst)
rustc-hash = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
typst.workspace = true
typst-kit.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
# names compared without accents (the import of DataVolley)
unicode-normalization.workspace = true
uuid.workspace = true
zip.workspace = true

# Android has its own verifier of certificates, which needs the context of
# the app (JNI): the roots of Mozilla, built in, instead
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0.9"

[dev-dependencies]
dirs.workspace = true
tempfile.workspace = true
# a local server stands for the upload API
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
